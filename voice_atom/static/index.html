<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>voice-atom 按住说话</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      padding: 1.5rem;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem 1.25rem 1.75rem;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.06);
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 .35rem;
      letter-spacing: .02em;
    }
    .sub {
      color: var(--muted);
      font-size: .85rem;
      margin: 0 0 1.25rem;
      line-height: 1.45;
    }
    .status-block {
      margin-bottom: .85rem;
      padding: .65rem .75rem;
      border-radius: 10px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.08);
    }
    .status-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--muted);
      margin-bottom: .35rem;
    }
    #status {
      font-size: .88rem;
      color: var(--text);
      min-height: 1.35rem;
      margin-bottom: .5rem;
    }
    #status.busy { color: var(--accent); }
    #status.err { color: var(--danger); }
    #status.ok { color: var(--ok); }
    #timingPanel {
      font-size: .78rem;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: var(--muted);
      line-height: 1.45;
      min-height: 2.4em;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #timingPanel.has-data {
      color: #a5d6ff;
      border-left: 3px solid var(--accent);
      padding-left: .5rem;
      margin-left: -2px;
    }
    #hold {
      width: 100%;
      padding: 1.1rem 1rem;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(59,130,246,.35);
      user-select: none;
      touch-action: manipulation;
      transition: transform .08s ease, filter .12s ease;
    }
    #hold:active {
      transform: scale(0.98);
      filter: brightness(1.08);
    }
    #hold:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(.3);
    }
    label {
      display: block;
      margin: 1.25rem 0 .4rem;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
    }
    #out {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.25);
      color: var(--text);
      padding: .75rem .85rem;
      font-size: .95rem;
      line-height: 1.55;
    }
    footer {
      margin-top: 1rem;
      font-size: .72rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>voice-atom 网页录音</h1>
    <p class="sub">按住下方按钮说话，松开后自动上传并转写，结果会<strong>追加</strong>到文本框。请使用与本服务同源地址打开（例如 <code>http://127.0.0.1:17860/ui/</code>）。<strong>不是 Windows 任务栏</strong>：请看按钮<strong>上方灰色卡片</strong>里的「状态 / 耗时」。</p>
    <div class="status-block">
      <div class="status-label">状态（本页内）</div>
      <div id="status" class="status">就绪</div>
      <div id="timingPanel" class="timing-panel">转写成功后，这里会显示 upload / convert / ASR / 合计 的毫秒数。</div>
    </div>
    <button id="hold" type="button">按住说话</button>
    <label for="out">累计转写</label>
    <textarea id="out" readonly spellcheck="false" placeholder="松开按钮后，转写会出现在这里…"></textarea>
    <footer>需要浏览器允许麦克风。音频以 WebM 上传，服务端用 ffmpeg 转为 16kHz WAV 后调用 whisper。</footer>
  </main>
  <script>
(function () {
  const statusEl = document.getElementById("status");
  const timingEl = document.getElementById("timingPanel");
  const hold = document.getElementById("hold");
  const out = document.getElementById("out");

  let stream = null;
  let recorder = null;
  let chunks = [];
  let recording = false;
  let busy = false;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function setTiming(text, hasData) {
    timingEl.textContent = text;
    timingEl.className = "timing-panel" + (hasData ? " has-data" : "");
  }

  function pickMime() {
    const c = "audio/webm;codecs=opus";
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
    if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")) return "audio/webm";
    return "";
  }

  async function start() {
    if (busy || recording) return;
    chunks = [];
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setStatus("无法访问麦克风：" + (e && e.message ? e.message : e), "err");
      return;
    }
    const mime = pickMime();
    try {
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    } catch (e) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
      setStatus("无法创建录音器：" + (e && e.message ? e.message : e), "err");
      return;
    }
    recorder.ondataavailable = function (ev) {
      if (ev.data && ev.data.size > 0) chunks.push(ev.data);
    };
    try {
      recorder.start(120);
    } catch (e) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
      recorder = null;
      setStatus("无法开始录音：" + (e && e.message ? e.message : e), "err");
      return;
    }
    recording = true;
    setStatus("录音中… 松开后上传转写", "busy");
    setTiming("（录音中，尚无耗时）", false);
  }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  async function stop() {
    if (!recording || !recorder) return;
    recording = false;
    setStatus("正在结束录音…", "busy");
    await new Promise(function (resolve) {
      recorder.onstop = resolve;
      try { recorder.stop(); } catch (e) { resolve(); }
    });
    recorder = null;
    stopStream();

    const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : "audio/webm" });
    if (!blob.size) {
      setStatus("录音过短，没有采集到数据。", "err");
      return;
    }
    busy = true;
    hold.disabled = true;
    setStatus("上传并转写中…", "busy");
    setTiming("（等待服务器…）", false);
    const fd = new FormData();
    fd.append("file", blob, "hold.webm");
    try {
      const res = await fetch("/transcribe-upload", { method: "POST", body: fd });
      const data = await res.json();
      if (data.ok) {
        const t = (data.text || "").trim();
        const prev = out.value.trimEnd();
        out.value = prev ? prev + "\n" + t : t;
        setStatus("就绪", "ok");
        if (data.timing) {
          const ti = data.timing;
          setTiming(
            "耗时（ms）upload=" + ti.upload_save_ms +
            "  convert=" + ti.audio_convert_ms +
            "  ASR=" + ti.asr_ms +
            "  合计=" + ti.total_ms,
            true
          );
        } else {
          setTiming("（本次响应未带 timing 字段）", false);
        }
      } else {
        const msg = data.error && data.error.message ? data.error.message : JSON.stringify(data);
        setStatus("转写失败：" + msg, "err");
      }
    } catch (e) {
      setStatus("网络错误：" + (e && e.message ? e.message : e), "err");
    } finally {
      busy = false;
      hold.disabled = false;
    }
  }

  function onDown(ev) {
    ev.preventDefault();
    start();
  }
  function onUp(ev) {
    ev.preventDefault();
    if (recording) stop();
  }

  hold.addEventListener("mousedown", onDown);
  hold.addEventListener("mouseup", onUp);
  hold.addEventListener("mouseleave", function (ev) {
    if (recording) onUp(ev);
  });
  hold.addEventListener("touchstart", onDown, { passive: false });
  hold.addEventListener("touchend", onUp, { passive: false });
  hold.addEventListener("touchcancel", onUp, { passive: false });

  window.addEventListener("mouseup", function () {
    if (recording) stop();
  });
})();
  </script>
</body>
</html>
