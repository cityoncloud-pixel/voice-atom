[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-atom"
version = "0.1.0"
description = "Local-first atomic ASR: audio to text via CLI, Python SDK, and local HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "voice-atom contributors" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "sounddevice>=0.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
voice-atom = "voice_atom.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_atom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
